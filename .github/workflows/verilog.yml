name: Verilog simulations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - name: Check all projects
        run: python3 tools/run_checks.py
